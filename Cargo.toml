[package]
name = "nikka"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Daily ops & intel for a Linux desktop: patch, purge, briefing"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
htmlize = { version = "1.1.0", features = ["unescape"] }
jiff = "0.2.38"
quick-xml = "0.42.0"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["event", "fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
signal-hook = "0.4.5"
toml = "1.1.8"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
ureq = "3.4.2"

[dev-dependencies]
png = "0.18.1"
tempfile = "3.27.0"

[[example]]
name = "logogen"
test = true

[profile.release]
strip = true
